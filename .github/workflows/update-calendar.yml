name: Update Football Calendar

on:
  workflow_dispatch:

  schedule:
    - cron: "17 3 */2 * *"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run football calendar agent
        run: python main.py

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/football.ics public/preview.txt
          git diff --cached --quiet || git commit -m "Update football calendar"
          git push
